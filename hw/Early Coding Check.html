<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Live Markdown viewer for the Early Coding Check assignment.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Early Coding Check</title>
  <link rel="stylesheet" href="./homework-viewer.css">
  <script defer src="../syllabus/vendor/marked.umd.js"></script>
  <script defer src="./toolset-test-viewer.js"></script>
</head>
<body>
  <header class="viewer-toolbar">
    <div class="viewer-toolbar__inner">
      <div class="viewer-toolbar__title">
        Early Coding Check preview <code>Early Coding Check.md</code>
      </div>
      <nav class="viewer-toolbar__actions" aria-label="Assignment preview controls">
        <button class="viewer-button" id="reload-markdown" type="button">Reload Markdown</button>
        <label class="file-picker-label" for="markdown-file">
          Open Markdown
          <input class="file-picker-input" id="markdown-file" type="file" accept=".md,text/markdown,text/plain">
        </label>
        <a class="viewer-link" href="./Early%20Coding%20Check.md" target="_blank" rel="noopener">View source</a>
      </nav>
    </div>
    <div class="viewer-status" id="viewer-status" role="status" aria-live="polite">Preparing the assignment...</div>
  </header>

  <main class="homework-shell">
    <article class="homework-document" id="homework-document" aria-label="Early Coding Check assignment" data-source-path="./Early%20Coding%20Check.md" data-source-name="Early Coding Check.md" data-assignment-suffix="" aria-busy="true">
      <section class="viewer-message">
        <h1>Loading assignment</h1>
        <p>The editable Markdown source is being rendered.</p>
      </section>
    </article>
  </main>

  <noscript>
    <p>This page needs JavaScript to render the Markdown assignment. You can still open <a href="./Early%20Coding%20Check.md">the Markdown source</a> directly.</p>
  </noscript>
</body>
</html>
