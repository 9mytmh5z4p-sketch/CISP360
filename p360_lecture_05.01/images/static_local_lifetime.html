<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Static Local Lifetime</title>
<style>
:root{color-scheme:light dark;--bg:#10151c;--panel:#1b2430;--text:#edf2f7;--muted:#a9b6c4;--accent:#77c7ff;--static:#ffd166;--line:#607286}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:18px/1.35 system-ui,sans-serif}main{width:min(960px,94vw);padding:28px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,40px);font-weight:600}#status{min-height:1.5em;color:var(--muted)}.stage{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}.panel{min-height:230px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.panel h2{margin:0 0 16px;font-size:22px}.frame{padding:14px;border:2px solid var(--accent);border-radius:10px}.frame.empty{opacity:.35}.value{margin-top:12px;font-size:28px;color:var(--accent-2)}.static-box{padding:18px;border:3px solid var(--static);border-radius:10px;color:var(--static);font-size:30px;text-align:center}.controls{display:flex;flex-wrap:wrap;gap:10px}button{padding:10px 16px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:#263241;font:inherit;cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent)}.count{margin-left:auto;color:var(--muted)}@media(max-width:650px){.stage{grid-template-columns:1fr}.count{margin-left:0;width:100%}}
</style>
</head>
<body>
<main aria-labelledby="title">
<h1 id="title">Where Does a Static Local Live?</h1>
<div id="status" aria-live="polite"></div>
<section class="stage" aria-label="Animated comparison of a stack frame and static local storage">
<div class="panel"><h2>Current call frame</h2><div id="frame" class="frame"><strong>countCall()</strong><div id="local" class="value">count: 0</div></div></div>
<div class="panel"><h2>Persistent function-owned storage</h2><div id="static" class="static-box">count: 0</div></div>
</section>
<div class="controls"><button id="play" type="button">Play</button><button id="pause" type="button">Pause</button><button id="step" type="button">Step</button><button id="reset" type="button">Reset</button><span id="count" class="count"></span></div>
</main>
<script>
const states=[
{local:"count: not created",static:"count: 0",frame:false,text:"Before the call: no stack frame exists, but the static storage is ready."},
{local:"count: 0",static:"count: 0",frame:true,text:"Call 1: the function frame appears and reads the persistent count."},
{local:"count: 1",static:"count: 1",frame:true,text:"Call 1: the function increments the static local, then returns."},
{local:"count: not created",static:"count: 1",frame:false,text:"After the call: the stack frame disappears, but the static value remains."},
{local:"count: 2",static:"count: 2",frame:true,text:"Call 2: a new frame appears and continues from the saved static value."}
];
const frame=document.querySelector("#frame"),localValue=document.querySelector("#local"),staticValue=document.querySelector("#static"),status=document.querySelector("#status"),count=document.querySelector("#count");
let index=0,timer=null;
function render(){const state=states[index];frame.classList.toggle("empty",!state.frame);localValue.textContent=state.local;staticValue.textContent=state.static;status.textContent=state.text;count.textContent="Step "+(index+1)+" of "+states.length;}
function next(){index=(index+1)%states.length;render();}
document.querySelector("#play").addEventListener("click",()=>{if(timer===null)timer=setInterval(next,1600)});
document.querySelector("#pause").addEventListener("click",()=>{clearInterval(timer);timer=null});
document.querySelector("#step").addEventListener("click",next);
document.querySelector("#reset").addEventListener("click",()=>{clearInterval(timer);timer=null;index=0;render()});
render();
</script>
</body>
</html>
