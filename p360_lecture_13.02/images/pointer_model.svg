<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>

  <!-- pointer variable -->
  <text x="185" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f3a5f">Pointer variable</text>
  <text x="185" y="88" text-anchor="middle" font-size="22" font-family="Courier New, monospace" fill="#111827">selected</text>
  <rect x="70" y="104" width="230" height="64" fill="#fde7d9" stroke="#c2410c" stroke-width="3" rx="6"/>
  <text x="185" y="145" text-anchor="middle" font-size="24" font-family="Courier New, monospace" fill="#9a3412" font-weight="bold">0x7ffe1a20</text>
  <text x="185" y="200" text-anchor="middle" font-size="17" fill="#4b5563">stored value: an address</text>
  <text x="185" y="226" text-anchor="middle" font-size="17" fill="#4b5563" font-family="Courier New, monospace">lives at 0x7ffe1a28</text>

  <!-- target -->
  <text x="690" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f3a5f">Target (pointee)</text>
  <text x="690" y="88" text-anchor="middle" font-size="22" font-family="Courier New, monospace" fill="#111827">score</text>
  <rect x="590" y="104" width="200" height="64" fill="#e8eef5" stroke="#1f3a5f" stroke-width="3" rx="6"/>
  <text x="690" y="146" text-anchor="middle" font-size="28" font-family="Courier New, monospace" fill="#111827">88</text>
  <text x="690" y="200" text-anchor="middle" font-size="17" fill="#4b5563">stored value: the data</text>
  <text x="690" y="226" text-anchor="middle" font-size="17" fill="#4b5563" font-family="Courier New, monospace">lives at 0x7ffe1a20</text>

  <!-- indirection arrow -->
  <line x1="304" y1="136" x2="580" y2="136" stroke="#c2410c" stroke-width="4" marker-end="url(#arr)"/>
  <text x="442" y="124" text-anchor="middle" font-size="17" fill="#9a3412" font-weight="bold">follow the address</text>
  <text x="442" y="162" text-anchor="middle" font-size="17" fill="#9a3412">(indirection)</text>

  <text x="450" y="280" text-anchor="middle" font-size="18" fill="#1f3a5f">Two separate pieces of storage: the pointer holds the target's address</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
