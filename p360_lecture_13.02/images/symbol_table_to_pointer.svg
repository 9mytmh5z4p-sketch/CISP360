<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>

  <!-- compile time: symbol table -->
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#1f3a5f">Compiler knows (symbol table)</text>
  <g font-size="18">
    <rect x="40" y="50" width="420" height="40" fill="#e8eef5" stroke="#1f3a5f" stroke-width="2"/>
    <text x="60"  y="77" fill="#1f3a5f" font-weight="bold">name</text>
    <text x="170" y="77" fill="#1f3a5f" font-weight="bold">type</text>
    <text x="280" y="77" fill="#1f3a5f" font-weight="bold">address</text>
    <rect x="40" y="90" width="420" height="44" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
    <line x1="150" y1="50" x2="150" y2="134" stroke="#1f3a5f" stroke-width="2"/>
    <line x1="260" y1="50" x2="260" y2="134" stroke="#1f3a5f" stroke-width="2"/>
    <text x="60"  y="119" font-family="Courier New, monospace" fill="#111827">score</text>
    <text x="170" y="119" font-family="Courier New, monospace" fill="#111827">int</text>
    <rect x="266" y="96" width="188" height="32" fill="#fde7d9" stroke="#c2410c" stroke-width="2" rx="4"/>
    <text x="280" y="119" font-family="Courier New, monospace" fill="#9a3412" font-weight="bold">0x7ffe1a20</text>
  </g>

  <!-- runtime: memory -->
  <text x="520" y="34" font-size="20" font-weight="bold" fill="#1f3a5f">Running program (memory)</text>
  <g font-size="18">
    <text x="520" y="80" font-family="Courier New, monospace" fill="#4b5563">0x7ffe1a20</text>
    <rect x="660" y="54" width="200" height="44" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="760" y="83" text-anchor="middle" font-family="Courier New, monospace" fill="#111827" font-size="22">88</text>
    <text x="870" y="83" fill="#1f3a5f" font-size="16" text-anchor="end" dx="40"></text>
    <text x="760" y="120" text-anchor="middle" fill="#1f3a5f" font-size="16">score</text>

    <text x="520" y="250" font-family="Courier New, monospace" fill="#4b5563">0x7ffe1a28</text>
    <rect x="660" y="224" width="200" height="44" fill="#fde7d9" stroke="#c2410c" stroke-width="2"/>
    <text x="760" y="253" text-anchor="middle" font-family="Courier New, monospace" fill="#9a3412" font-weight="bold">0x7ffe1a20</text>
    <text x="760" y="290" text-anchor="middle" fill="#1f3a5f" font-size="16">scorePtr</text>
  </g>

  <!-- address copied out of the symbol table into a pointer variable -->
  <path d="M360,134 C360,230 520,246 652,246" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arr)"/>
  <text x="300" y="214" font-size="17" fill="#9a3412" font-weight="bold">&amp;score puts the address</text>
  <text x="300" y="236" font-size="17" fill="#9a3412" font-weight="bold">into a variable</text>

  <!-- pointer leads to target -->
  <path d="M860,246 C895,246 895,76 868,76" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arr)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
